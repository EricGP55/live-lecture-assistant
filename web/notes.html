<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class notes</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b35; --text:#e6e8ec; --muted:#8b93a3; --accent:#8b7cf6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; display:flex; gap:12px; align-items:center; padding:12px 20px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  header a { color:var(--muted); text-decoration:none; font-size:13px; }
  header a:hover { color:var(--text); }
  header .sp { flex:1; }
  button { background:#2a303c; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 12px;
           font:inherit; font-size:13px; cursor:pointer; }
  button:hover { background:#343b49; }
  button:disabled { opacity:.5; }
  main { max-width:820px; margin:0 auto; padding:24px 24px 80px; }
  h1 { font-size:24px; line-height:1.3; margin:0 0 16px; }
  h2 { font-size:17px; margin:28px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--line); }
  h3 { font-size:15px; margin:18px 0 6px; }
  ul { padding-left:22px; margin:6px 0; } li { margin:3px 0; }
  code { background:#1c2029; border-radius:4px; padding:1px 5px; font-size:13px; }
  blockquote { margin:8px 0; padding:6px 12px; border-left:3px solid #f5c542; color:#e8d9a8; background:#1c1a12; }
  em { color:#cfd3da; }
  .muted { color:var(--muted); }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); font-size:14px; }
  th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  td a { color:var(--text); }
  .pill { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <a href="/">← Live class</a>
  <a href="/notes">All classes</a>
  <span class="sp"></span>
  <span id="actions" hidden>
    <button id="copy">Copy Markdown</button>
    <button id="download">Download .md</button>
    <button id="regen" title="Write these notes again with Claude">Rewrite</button>
  </span>
</header>
<main id="main"><p class="muted">Loading…</p></main>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = s => { s = Math.floor(s || 0); const h = Math.floor(s/3600), m = Math.floor(s/60)%60, x = s%60;
  return (h ? h + ':' : '') + String(m).padStart(2,'0') + ':' + String(x).padStart(2,'0'); };

// Small Markdown renderer for the notes format: headings, bullet lists (2 levels), quotes, **bold**, _italic_, `code`.
function inline(t) {
  return esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
               .replace(/(^|\W)_(.+?)_(?=\W|$)/g, '$1<em>$2</em>');
}
function render(md) {
  const out = []; let depth = 0;
  const close = d => { while (depth > d) { out.push('</ul>'); depth--; } };
  for (const raw of md.split('\n')) {
    const m = raw.match(/^(\s*)- (.*)$/);
    if (m) {
      const d = m[1].length >= 2 ? 2 : 1;
      while (depth < d) { out.push('<ul>'); depth++; }
      close(d);
      out.push(`<li>${inline(m[2])}</li>`);
      continue;
    }
    if (/^\s{2,}\S/.test(raw) && depth) { out[out.length - 1] = out[out.length - 1].replace('</li>', '<br>' + inline(raw.trim()) + '</li>'); continue; }
    close(0);
    if (raw.startsWith('### ')) out.push(`<h3>${inline(raw.slice(4))}</h3>`);
    else if (raw.startsWith('## ')) out.push(`<h2>${inline(raw.slice(3))}</h2>`);
    else if (raw.startsWith('# ')) out.push(`<h1>${inline(raw.slice(2))}</h1>`);
    else if (raw.startsWith('> ')) out.push(`<blockquote>${inline(raw.slice(2))}</blockquote>`);
    else if (raw.trim()) out.push(`<p>${inline(raw)}</p>`);
  }
  close(0);
  return out.join('\n');
}

async function list() {
  document.title = 'Class notes';
  const rows = await (await fetch('/api/classes')).json();
  $('main').innerHTML = `<h1>Classes</h1>` + (rows.length ? `<table><tr><th>Date</th><th>Subject</th><th>Length</th><th>Notes</th></tr>`
    + rows.map(r => `<tr><td>${new Date(r.started_at * 1000).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}</td>
        <td>${esc(r.subject)}</td><td class="pill">${fmt(r.duration)} · ${r.sentences} sentences</td>
        <td>${r.notes_path ? `<a href="/notes/${r.id}">Open</a>` : (r.sentences ? `<button data-write="${r.id}">Write notes</button>` : '<span class="pill">empty</span>')}</td></tr>`).join('')
    + '</table>' : '<p class="muted">No classes yet.</p>');
}
async function show(id) {
  const r = await fetch('/api/notes/' + id);
  if (!r.ok) { $('main').innerHTML = `<p class="muted">These notes are not written yet.</p><button data-write="${id}">Write notes</button>`; return; }
  const md = await r.text();
  $('main').innerHTML = render(md);
  document.title = md.split('\n')[0].replace(/^# /, '');
  $('actions').hidden = false;
  $('copy').onclick = () => { navigator.clipboard?.writeText(md); $('copy').textContent = 'Copied'; setTimeout(() => $('copy').textContent = 'Copy Markdown', 1200); };
  $('download').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown' }));
    a.download = document.title.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') + '.md';
    a.click();
  };
  $('regen').onclick = () => write(id, $('regen'));
}
async function write(id, btn) {
  btn.disabled = true; btn.textContent = 'Writing… (up to a minute)';
  const r = await (await fetch('/api/notes/' + id, { method: 'POST' })).json();
  if (r.ok) location.href = '/notes/' + id; else { btn.textContent = 'Failed — try again'; btn.disabled = false; }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-write]'); if (b) write(b.dataset.write, b); });

const id = location.pathname.split('/')[2];
id ? show(id) : list();
</script>
</body>
</html>
