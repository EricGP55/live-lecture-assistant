<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class · mini</title>
<style>
  :root { --bg:#0b0d11; --line:#1f242d; --text:#d9dce2; --muted:#7b8394; --teacher:#5b9dff; --student:#f0a04b; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 -apple-system, sans-serif; }
  .top { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); color:var(--muted); font-size:12px; }
  .rec { width:7px; height:7px; border-radius:50%; background:#444; }
  .rec.on { background:#ef4444; }
  #alerts { padding:10px 12px; border-bottom:1px solid var(--line); color:var(--muted); font-size:12px; }
  #list { padding:6px 12px 60px; }
  .f { padding:5px 0; border-bottom:1px solid var(--line); }
  .f b { font-size:10px; margin-right:6px; }
  .T b { color:var(--teacher); } .S b { color:var(--student); } .X b { color:var(--muted); }
  .partial { color:var(--muted); font-style:italic; }
  .box { position:fixed; bottom:0; left:0; right:0; padding:8px 12px; border-top:1px solid var(--line); background:var(--bg); }
  .box input { width:100%; box-sizing:border-box; background:#151920; border:1px solid var(--line); color:var(--muted);
                border-radius:6px; padding:7px 9px; font:inherit; }
</style>
</head>
<body>
<div class="top"><span class="rec" id="rec"></span><span id="subject">Class</span></div>
<div id="alerts">Alerts: coming in phase 4.</div>
<div id="list"></div>
<div class="box"><input disabled placeholder="Ask the AI (phase 2)…"></div>
<script>
const $ = id => document.getElementById(id);
const cls = sp => sp === 'T' ? 'T' : sp === 'S' ? 'S' : 'X';
const esc = t => t.replace(/</g, '&lt;');
const latest = new Map(); let partial = '';
function draw() {
  const items = [...latest.values()].slice(-6);
  $('list').innerHTML = items.map(f => `<div class="f ${cls(f.speaker)}"><b>${f.speaker || '?'}</b>${esc(f.text)}</div>`).join('')
    + (partial ? `<div class="f partial">${esc(partial)}</div>` : '');
}
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'sentence') { latest.set(ev.id, ev); if (latest.size > 20) latest.delete(latest.keys().next().value); draw(); }
    else if (ev.type === 'speaker' && latest.has(ev.id)) { latest.get(ev.id).speaker = ev.speaker; draw(); }
    else if (ev.type === 'partial') { partial = ev.text || ''; draw(); }
    else if (ev.type === 'class') $('subject').textContent = ev.subject;
    else if (ev.type === 'status') $('rec').classList.toggle('on', ev.text.startsWith('Listening'));
  };
  ws.onclose = () => setTimeout(connect, 1500);
}
connect();
</script>
</body>
</html>
