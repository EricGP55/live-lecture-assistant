# Live class assistant configuration.
language: es            # informative; Parakeet v3 auto-detects the language (es, en and ~25 European languages)

audio:
  device: null          # null = default mic. Name (or part of it) or index: see `python main.py --devices`
  save: true            # keep compressed audio (Opus) to listen again later
  bitrate: 24k          # ~11 MB per hour

stt:
  model: mlx-community/parakeet-tdt-0.6b-v3
  partial_every_s: 1.5  # how often the provisional text is refreshed while someone is speaking

vad:
  min_silence_s: 0.5    # pause that closes a sentence
  min_speech_s: 0.25
  max_sentence_s: 15    # split very long sentences (memory and latency)

speakers:
  same_speaker_threshold: 0.70   # cosine similarity to treat two segments as the same voice
  saved_teacher_threshold: 0.65  # similarity with the subject's saved teacher voiceprint
  min_speech_to_decide_s: 20     # seconds of speech before fixing who the teacher is (when no voiceprint exists)

llm:
  backend: subscription # uses your Claude subscription login (Claude Agent SDK); no API key
  answer_model: sonnet  # sonnet = better answers, haiku = faster
  effort: low           # low keeps answers quick and cheap
  context_chars: 5000   # max transcript characters sent per question (~1,300 tokens)

doubts:
  match_floor: 0.85        # never ask Claude to confirm below this similarity (e5) between a doubt and a sentence
  match_strong: 0.88       # a sentence this similar is clearly about the doubt: confirm right away
  match_z: 2.0             # or a sentence this many std devs above that doubt's usual similarity
  confirm_cooldown_s: 30   # min time between confirmations of the same doubt (skipped for strong matches)
  pause_moment_s: 4        # silence after the teacher that counts as a "good moment to ask"

notifications:
  enabled: true            # silent macOS banners (doubt answered, good moment to ask)

server:
  host: 127.0.0.1       # only reachable from this Mac
  port: 8765

data: data              # folder with class.db, audio/ and notes/
